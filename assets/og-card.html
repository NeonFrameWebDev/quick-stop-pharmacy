<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#fff;font-family:'Inter',sans-serif;color:#0F172A}
  .card{
    width:1200px;height:630px;position:relative;
    background:
      radial-gradient(ellipse 50% 60% at 8% 30%, rgba(220,38,38,0.10) 0%, transparent 65%),
      radial-gradient(ellipse 40% 50% at 95% 95%, rgba(37,99,235,0.08) 0%, transparent 65%),
      #fff;
    display:grid;grid-template-columns: 1fr 360px;gap:70px;
    padding: 70px 80px;
    align-items:center;
  }
  .text{display:flex;flex-direction:column;gap:18px}
  .rating-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:#FEF2F2;color:#991B1B;
    padding:8px 16px;border-radius:999px;font-size:16px;font-weight:600;
    border:1px solid rgba(220,38,38,0.22);
    width:fit-content;
  }
  .stars{color:#F59E0B;letter-spacing:2px}
  .h1{
    font-family:'Outfit',sans-serif;font-weight:800;
    font-size:80px;line-height:1.02;letter-spacing:-0.025em;
    color:#0F172A;
  }
  .accent{color:#DC2626}
  .sub{
    font-size:22px;color:#334155;line-height:1.45;max-width:600px;
  }
  .tags{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
  .tag{
    background:#fff;color:#334155;
    padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;
    border:1px solid #E5E7EB;
  }
  .tag.tag-blue { background:#EFF6FF; color:#1E40AF; border-color: rgba(37,99,235,0.25); }

  /* Capsule visual */
  .visual{
    position:relative;
    width:360px;height:480px;
    display:flex;align-items:center;justify-content:center;
  }
  .capsule{
    position:relative;
    width:200px;height:380px;
    filter: drop-shadow(0 30px 50px rgba(220,38,38,0.22)) drop-shadow(0 10px 20px rgba(0,0,0,0.08));
  }
  .capsule .top{
    position:absolute;top:0;left:0;right:0;height:50%;
    background:#2563EB;
    border-radius: 100px 100px 0 0;
  }
  .capsule .bot{
    position:absolute;bottom:0;left:0;right:0;height:50%;
    background:#DC2626;
    border-radius: 0 0 100px 100px;
  }
  .capsule .seam{
    position:absolute;top:50%;left:0;right:0;height:3px;
    background: #fff;
    transform: translateY(-50%);
  }
  /* subtle inner highlight */
  .capsule .top::before, .capsule .bot::before {
    content:""; position:absolute; top:18px; left:24px; right:90px; height:60%;
    background:linear-gradient(180deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0) 100%);
    border-radius: 60px;
    pointer-events:none;
  }

  .url{
    position:absolute;bottom:36px;left:80px;
    font-size:13px;font-weight:600;
    color:#94A3B8;letter-spacing:0.18em;text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="rating-pill">
      <span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
      <span>5.0 en Google</span>
    </div>
    <h1 class="h1">Quick Stop<br/><span class="accent">Pharmacy</span></h1>
    <p class="sub">Dos sucursales en Puerto Pe&ntilde;asco. Personal que habla ingl&eacute;s. Abierto hasta tarde.</p>
    <div class="tags">
      <span class="tag">Benito Ju&aacute;rez</span>
      <span class="tag">Playa Bonita</span>
      <span class="tag tag-blue">+52 638 109 2129</span>
    </div>
  </div>
  <div class="visual">
    <div class="capsule">
      <div class="top"></div>
      <div class="bot"></div>
      <div class="seam"></div>
    </div>
  </div>
  <div class="url">neonframewebdesign.com / quick-stop-pharmacy</div>
</div>
</body>
</html>
